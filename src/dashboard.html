<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Jewelry Price Automation</title>
    <meta name="shopify-api-key" content="79010b4cb45313b6f057a5b14cc64e71">
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
    <style>
        table.price-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table.price-table th,
        table.price-table td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #e1e3e5;
        }
        table.price-table th {
            font-weight: 600;
            color: #6d7175;
        }
        .change-up { color: #0a5c1c; }
        .change-down { color: #8b0000; }
        .table-wrap { overflow-x: auto; }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 220px;
        }
        .field-label {
            font-size: 13px;
            font-weight: 600;
            color: #303030;
        }
        .field-input {
            padding: 8px 10px;
            border: 1px solid #c9cccf;
            border-radius: 6px;
            font-size: 14px;
        }
        .field-hint {
            font-size: 12px;
            color: #6d7175;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .product-row {
            border: 1px solid #e1e3e5;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .product-row-header {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .product-thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            background: #f1f1f1;
            flex-shrink: 0;
        }
        .product-title {
            font-weight: 600;
            font-size: 14px;
        }
        .product-status {
            font-size: 12px;
            color: #6d7175;
        }
        .variant-list {
            margin-top: 10px;
            padding-left: 52px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .variant-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .variant-row.disabled {
            color: #a5a5a5;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f1f1;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            margin: 3px 4px 3px 0;
        }
        .chip button {
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 700;
            color: #6d7175;
        }
        .chips-wrap {
            display: flex;
            flex-wrap: wrap;
        }
        .results-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #e1e3e5;
        }
        .results-tab-btn {
            padding: 8px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #6d7175;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .results-tab-btn.active {
            color: #202223;
            border-bottom-color: #202223;
        }
        .results-panel {
            display: flex;
            flex-direction: column;
        }
        .result-group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .result-caret {
            font-size: 11px;
            color: #6d7175;
            width: 10px;
            flex-shrink: 0;
        }
        .result-variant-row {
            display: grid;
            grid-template-columns: 1.4fr 1fr 0.8fr 1.6fr 1fr;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #f1f1f1;
        }
        .result-variant-row:last-child {
            border-bottom: none;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
            width: fit-content;
        }
        .status-badge.skipped {
            background: #fff4e4;
            color: #8a6116;
        }
        .status-badge.blocked,
        .status-badge.failed {
            background: #fbeae5;
            color: #8b0000;
        }
        .result-reason {
            color: #6d7175;
            font-size: 12px;
        }
        .results-empty {
            color: #6d7175;
            font-size: 14px;
            padding: 16px 4px;
        }
    </style>
    <script>
        async function shopifyFetch(url, options = {}) {
            const token = await window.shopify.idToken();
            const headers = { "Content-Type": "application/json", ...(options.headers || {}), Authorization: `Bearer ${token}` };
            return fetch(url, { ...options, headers });
        }

        async function testConnection() {
            const status = document.getElementById("connectionStatus");
            try {
                const response = await shopifyFetch("/health");
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Authentication failed");
                status.textContent = `Connected securely: ${data.shop}`;
            } catch (error) {
                status.textContent = `Connection failed: ${error.message}`;
            }
        }

        // ---------------- Settings ----------------

        const SETTINGS_FIELD_IDS = {
            gold_source_url: "setting-gold-source-url",
            silver_price_per_gram: "setting-silver-price",
            making_charge_type: "setting-making-charge-type",
            making_charge_value: "setting-making-charge-value",
            profit_multiplier: "setting-profit-multiplier",
            usd_conversion_rate: "setting-usd-rate",
            final_adjustment_percent: "setting-final-adjustment",
            max_price_change_percent: "setting-max-decrease",
        };

        async function loadSettings() {
            try {
                const response = await shopifyFetch("/api/settings");
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to load settings");

                for (const [key, id] of Object.entries(SETTINGS_FIELD_IDS)) {
                    const el = document.getElementById(id);
                    if (el) el.value = data.settings[key];
                }
            } catch (error) {
                document.getElementById("settings-status").textContent = `Could not load settings: ${error.message}`;
            }
        }

        async function saveSettings() {
            const btn = document.getElementById("settings-save-btn");
            const status = document.getElementById("settings-status");
            btn.textContent = "Saving...";
            btn.disabled = true;
            status.textContent = "";

            try {
                const payload = {};
                for (const [key, id] of Object.entries(SETTINGS_FIELD_IDS)) {
                    const el = document.getElementById(id);
                    payload[key] = el.value;
                }

                const response = await shopifyFetch("/api/settings", {
                    method: "POST",
                    body: JSON.stringify(payload),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to save settings");

                status.textContent = "Settings saved.";
            } catch (error) {
                status.textContent = `Save failed: ${error.message}`;
            } finally {
                btn.textContent = "Save Settings";
                btn.disabled = false;
            }
        }

        // ---------------- Gold Rate ----------------

        function renderGoldRate(rate) {
            const empty = "—";
            document.getElementById("gold-rate-24k").textContent = rate ? `₹${Number(rate.price_24k).toFixed(2)}/g` : empty;
            document.getElementById("gold-rate-18k").textContent = rate ? `₹${Number(rate.price_18k).toFixed(2)}/g` : empty;
            document.getElementById("gold-rate-14k").textContent = rate ? `₹${Number(rate.price_14k).toFixed(2)}/g` : empty;
            document.getElementById("gold-rate-10k").textContent = rate ? `₹${Number(rate.price_10k).toFixed(2)}/g` : empty;
            document.getElementById("gold-rate-updated").textContent = rate ? new Date(rate.fetched_at).toLocaleString() : "Not fetched yet";
        }

        async function loadLatestGoldRate() {
            try {
                const response = await shopifyFetch("/api/gold-rate/latest");
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to load gold rate");
                renderGoldRate(data.goldRate);
            } catch (error) {
                document.getElementById("gold-rate-error").textContent = error.message;
            }
        }

        async function fetchGoldRate() {
            const btn = document.getElementById("fetch-gold-btn");
            const errorBox = document.getElementById("gold-rate-error");
            errorBox.textContent = "";
            btn.textContent = "Fetching...";
            btn.disabled = true;

            try {
                const response = await shopifyFetch("/api/fetch-gold-rate", { method: "POST" });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to fetch gold rate");
                renderGoldRate(data.goldRate);
            } catch (error) {
                errorBox.textContent = error.message;
            } finally {
                btn.textContent = "Fetch Latest Gold Rate";
                btn.disabled = false;
            }
        }

        // ---------------- Product / Variant Selection ----------------

        let selectedVariants = new Map(); // variantId -> { productTitle, variantTitle, sku }
        let currentCollectionId = "";
        let currentSearch = "";
        let currentCursor = null;
        let productsAccumulated = [];
        let searchDebounceTimer = null;

        function safeId(id) {
            return String(id).replace(/[^a-zA-Z0-9]/g, "_");
        }

        async function loadCollections() {
            try {
                const response = await shopifyFetch("/api/collections");
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to load categories");

                const select = document.getElementById("collection-select");
                select.innerHTML = '<option value="">Select a category...</option>';
                for (const collection of data.collections) {
                    const option = document.createElement("option");
                    option.value = collection.id;
                    option.textContent = collection.title;
                    select.appendChild(option);
                }
            } catch (error) {
                document.getElementById("products-error").textContent = error.message;
            }
        }

        function onCollectionChange() {
            currentCollectionId = document.getElementById("collection-select").value;
            currentCursor = null;
            productsAccumulated = [];
            document.getElementById("products-list").innerHTML = "";
            if (currentCollectionId) loadProducts(true);
        }

        function onSearchInput() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                currentSearch = document.getElementById("product-search").value.trim();
                currentCursor = null;
                productsAccumulated = [];
                document.getElementById("products-list").innerHTML = "";
                if (currentCollectionId) loadProducts(true);
            }, 400);
        }

        async function loadProducts(reset) {
            const errorBox = document.getElementById("products-error");
            const loadMoreBtn = document.getElementById("load-more-btn");
            errorBox.textContent = "";

            if (!currentCollectionId) {
                errorBox.textContent = "Pick a category first.";
                return;
            }

            loadMoreBtn.textContent = "Loading...";
            loadMoreBtn.disabled = true;

            try {
                const params = new URLSearchParams({ collectionId: currentCollectionId });
                if (currentSearch) params.set("search", currentSearch);
                if (currentCursor) params.set("cursor", currentCursor);

                const response = await shopifyFetch(`/api/products?${params.toString()}`);
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to load products");

                if (reset) productsAccumulated = data.products;
                else productsAccumulated = productsAccumulated.concat(data.products);

                currentCursor = data.products.length > 0 ? data.products[data.products.length - 1].cursor : null;
                renderProductsList();

                loadMoreBtn.style.display = data.hasNextPage ? "inline-block" : "none";
            } catch (error) {
                errorBox.textContent = error.message;
            } finally {
                loadMoreBtn.textContent = "Load More Products";
                loadMoreBtn.disabled = false;
            }
        }

        function loadMoreProducts() {
            loadProducts(false);
        }

        function renderProductsList() {
            const container = document.getElementById("products-list");
            container.innerHTML = "";

            for (const product of productsAccumulated) {
                const id = safeId(product.id);
                const wrapper = document.createElement("div");
                wrapper.className = "product-row";
                wrapper.innerHTML = `
                    <div class="product-row-header" onclick="toggleProductVariants('${product.id}')">
                        <img class="product-thumb" src="${product.imageUrl || ""}" onerror="this.style.visibility='hidden'">
                        <div>
                            <div class="product-title">${product.title}</div>
                            <div class="product-status">${product.status}</div>
                        </div>
                    </div>
                    <div class="variant-list" id="variants-${id}" style="display:none;"></div>
                `;
                container.appendChild(wrapper);
            }
        }

        async function toggleProductVariants(productId) {
            const id = safeId(productId);
            const container = document.getElementById(`variants-${id}`);

            if (container.style.display === "none") {
                container.style.display = "flex";
                if (!container.dataset.loaded) {
                    container.textContent = "Loading variants...";
                    try {
                        const response = await shopifyFetch(`/api/product-variants?productId=${encodeURIComponent(productId)}`);
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error || "Failed to load variants");

                        container.innerHTML = "";
                        for (const variant of data.variants) {
                            const row = document.createElement("div");
                            row.className = "variant-row" + (variant.hasAllMetafields ? "" : " disabled");

                            const checkbox = document.createElement("input");
                            checkbox.type = "checkbox";
                            checkbox.disabled = !variant.hasAllMetafields;
                            checkbox.checked = selectedVariants.has(variant.id);
                            checkbox.onchange = () => toggleVariantSelection(
                                variant.id, data.productTitle, variant.title, variant.sku, checkbox.checked
                            );

                            const label = document.createElement("span");
                            label.textContent = `${variant.title} — $${Number(variant.price).toFixed(2)}${variant.sku ? " — " + variant.sku : ""}${!variant.hasAllMetafields ? " (missing cost data)" : ""}`;

                            row.appendChild(checkbox);
                            row.appendChild(label);
                            container.appendChild(row);
                        }

                        container.dataset.loaded = "1";
                    } catch (error) {
                        container.textContent = `Could not load variants: ${error.message}`;
                    }
                }
            } else {
                container.style.display = "none";
            }
        }

        function toggleVariantSelection(variantId, productTitle, variantTitle, sku, checked) {
            if (checked) {
                selectedVariants.set(variantId, { productTitle, variantTitle, sku });
            } else {
                selectedVariants.delete(variantId);
            }
            renderSelectedChips();
        }

        function removeSelectedVariant(variantId) {
            selectedVariants.delete(variantId);
            renderSelectedChips();

            const checkbox = document.querySelector(`input[data-variant-id="${variantId}"]`);
            if (checkbox) checkbox.checked = false;
        }

        function renderSelectedChips() {
            document.getElementById("selected-count").textContent = selectedVariants.size;
            const chipsBox = document.getElementById("selected-chips");
            chipsBox.innerHTML = "";

            for (const [variantId, info] of selectedVariants.entries()) {
                const chip = document.createElement("span");
                chip.className = "chip";
                chip.innerHTML = `${info.productTitle} / ${info.variantTitle} <button onclick="removeSelectedVariant('${variantId}')">×</button>`;
                chipsBox.appendChild(chip);
            }

            document.getElementById("update-selected-btn").disabled = selectedVariants.size === 0;
        }

        // ---------------- Update Prices ----------------

        function normalizeItem(item, fallbackTimestamp) {
            const oldPriceRaw = item.oldPrice ?? item.old_price;
            const newPriceRaw = item.newPrice ?? item.new_price;
            const changePercentRaw = item.changePercent ?? item.change_percent;

            return {
                productTitle: item.productTitle ?? item.product_title ?? "Unknown product",
                variantTitle: item.variantTitle ?? item.variant_title ?? "—",
                sku: item.sku ?? "—",
                metal: item.metal ?? "—",
                oldPrice: oldPriceRaw != null ? Number(oldPriceRaw) : null,
                newPrice: newPriceRaw != null ? Number(newPriceRaw) : null,
                changePercent: changePercentRaw != null ? Number(changePercentRaw) : null,
                status: item.status ?? "skipped",
                reason: item.reason ?? "",
                timestamp: item.updatedAt ?? item.created_at ?? fallbackTimestamp,
            };
        }

        // ---------------- Results: grouped by product, tabbed, searchable ----------------

        let updatedItemsRaw = [];
        let skippedItemsRaw = [];
        let activeResultsTab = "updated";
        let resultsSearchTerm = "";
        const expandedResultGroups = new Set();

        function groupItemsByProduct(items) {
            const map = new Map();
            for (const item of items) {
                if (!map.has(item.productTitle)) map.set(item.productTitle, []);
                map.get(item.productTitle).push(item);
            }
            return map;
        }

        function filterGroupsBySearch(groups, term) {
            if (!term) return groups;
            const lower = term.toLowerCase();
            const filtered = [];

            for (const [productTitle, variants] of groups) {
                const productMatches = productTitle.toLowerCase().includes(lower);
                const keep = productMatches ? variants : variants.filter((v) => v.sku.toLowerCase().includes(lower));
                if (keep.length > 0) filtered.push([productTitle, keep]);
            }

            return filtered;
        }

        function renderResultVariantRow(item) {
            const row = document.createElement("div");
            row.className = "result-variant-row";

            if (item.status === "updated") {
                const changeClass = item.changePercent >= 0 ? "change-up" : "change-down";
                row.innerHTML = `
                    <span>${item.variantTitle}</span>
                    <span>${item.sku}</span>
                    <span>${item.metal}</span>
                    <span>$${item.oldPrice.toFixed(2)} → $${item.newPrice.toFixed(2)}</span>
                    <span class="${changeClass}">${item.changePercent > 0 ? "+" : ""}${item.changePercent.toFixed(2)}%</span>
                `;
            } else {
                const badgeClass = item.status === "skipped" ? "skipped" : item.status;
                row.innerHTML = `
                    <span>${item.variantTitle}</span>
                    <span>${item.sku}</span>
                    <span>${item.metal}</span>
                    <span class="status-badge ${badgeClass}">${item.status}</span>
                    <span class="result-reason" title="${item.reason || ""}">${item.reason || "—"}</span>
                `;
            }

            return row;
        }

        function renderResultsPanel(panelId, rawItems, fallbackTimestamp) {
            const panel = document.getElementById(panelId);
            panel.innerHTML = "";

            const items = rawItems.map((item) => normalizeItem(item, fallbackTimestamp));
            const groups = filterGroupsBySearch([...groupItemsByProduct(items)], resultsSearchTerm.trim());

            if (groups.length === 0) {
                const empty = document.createElement("div");
                empty.className = "results-empty";
                empty.textContent = resultsSearchTerm.trim()
                    ? `No results for "${resultsSearchTerm.trim()}".`
                    : "Nothing here yet.";
                panel.appendChild(empty);
                return;
            }

            for (const [productTitle, variants] of groups) {
                const groupKey = `${panelId}::${productTitle}`;
                const isOpen = expandedResultGroups.has(groupKey);

                const wrapper = document.createElement("div");
                wrapper.className = "product-row";

                const header = document.createElement("div");
                header.className = "result-group-header";
                header.innerHTML = `
                    <span class="result-caret">${isOpen ? "▼" : "▶"}</span>
                    <div>
                        <div class="product-title">${productTitle}</div>
                        <div class="product-status">${variants.length} variant${variants.length === 1 ? "" : "s"}</div>
                    </div>
                `;
                header.onclick = () => {
                    if (expandedResultGroups.has(groupKey)) expandedResultGroups.delete(groupKey);
                    else expandedResultGroups.add(groupKey);
                    renderActiveResultsPanel();
                };
                wrapper.appendChild(header);

                if (isOpen) {
                    const variantList = document.createElement("div");
                    variantList.className = "variant-list";
                    for (const item of variants) variantList.appendChild(renderResultVariantRow(item));
                    wrapper.appendChild(variantList);
                }

                panel.appendChild(wrapper);
            }
        }

        function renderActiveResultsPanel() {
            if (activeResultsTab === "updated") {
                renderResultsPanel("results-updated-panel", updatedItemsRaw, lastRunTimestamp);
            } else {
                renderResultsPanel("results-skipped-panel", skippedItemsRaw, lastRunTimestamp);
            }
        }

        let lastRunTimestamp = null;

        function setResultsData(updatedRaw, skippedRaw, fallbackTimestamp) {
            updatedItemsRaw = updatedRaw || [];
            skippedItemsRaw = skippedRaw || [];
            lastRunTimestamp = fallbackTimestamp;
            renderActiveResultsPanel();
        }

        function switchResultsTab(tab) {
            activeResultsTab = tab;
            document.getElementById("tab-updated-btn").classList.toggle("active", tab === "updated");
            document.getElementById("tab-skipped-btn").classList.toggle("active", tab === "skipped");
            document.getElementById("results-updated-panel").style.display = tab === "updated" ? "flex" : "none";
            document.getElementById("results-skipped-panel").style.display = tab === "skipped" ? "flex" : "none";
            renderActiveResultsPanel();
        }

        function onResultsSearchInput() {
            resultsSearchTerm = document.getElementById("results-search").value;
            renderActiveResultsPanel();
        }

        function renderSummary(summary) {
            document.getElementById("update-summary-total").textContent = summary.total;
            document.getElementById("update-summary-updated").textContent = summary.updated;
            document.getElementById("update-summary-skipped").textContent = summary.skipped;
            document.getElementById("update-summary-blocked").textContent = summary.blocked;
        }

        async function loadLatestRun() {
            try {
                const response = await shopifyFetch("/api/latest-run");
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Failed to load latest run");

                if (data.run) {
                    renderSummary({
                        total: data.run.total_variants,
                        updated: data.run.updated_count,
                        skipped: data.run.skipped_count,
                        blocked: data.run.blocked_count,
                    });
                    setResultsData(data.updatedItems, data.skippedItems, data.run.completed_at);
                }
            } catch (error) {
                console.error("Failed to load latest run:", error);
            }
        }

        async function runUpdate(variantIds) {
            const errorBox = document.getElementById("update-error");
            errorBox.textContent = "";

            const selectedBtn = document.getElementById("update-selected-btn");
            const fullBtn = document.getElementById("update-full-btn");
            const originalSelectedText = selectedBtn.textContent;
            const originalFullText = fullBtn.textContent;

            selectedBtn.disabled = true;
            fullBtn.disabled = true;
            (variantIds ? selectedBtn : fullBtn).textContent = "Updating prices...";

            try {
                const response = await shopifyFetch("/api/update-prices", {
                    method: "POST",
                    body: JSON.stringify(variantIds ? { variantIds } : {}),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Price update failed");

                renderSummary(data.summary);
                setResultsData(data.updatedItems, data.skippedItems, new Date().toISOString());

                if (variantIds) {
                    selectedVariants.clear();
                    renderSelectedChips();
                }
            } catch (error) {
                errorBox.textContent = error.message;
            } finally {
                selectedBtn.textContent = originalSelectedText;
                fullBtn.textContent = originalFullText;
                selectedBtn.disabled = selectedVariants.size === 0;
                fullBtn.disabled = false;
            }
        }

        function updateSelectedPrices() {
            if (selectedVariants.size === 0) return;
            runUpdate([...selectedVariants.keys()]);
        }

        function updateFullCatalogPrices() {
            const confirmed = confirm(
                "This will scan and reprice EVERY product in your entire catalog that has complete cost data. Continue?"
            );
            if (confirmed) runUpdate(null);
        }

        window.addEventListener("DOMContentLoaded", () => {
            testConnection();
            loadSettings();
            loadLatestGoldRate();
            loadCollections();
            loadLatestRun();
        });
    </script>
</head>

<body>
    <s-page heading="Jewelry Price Automation">

        <s-section heading="Settings">
            <s-stack gap="base">
                <div class="form-grid">
                    <div class="field-group">
                        <label class="field-label" for="setting-gold-source-url">Gold Source URL</label>
                        <input class="field-input" id="setting-gold-source-url" type="text">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="setting-silver-price">Silver Price (₹/gram)</label>
                        <input class="field-input" id="setting-silver-price" type="number" step="0.01">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="setting-making-charge-type">Making Charge Type</label>
                        <select class="field-input" id="setting-making-charge-type">
                            <option value="flat_per_gram">Flat ₹ per gram</option>
                            <option value="percent_of_metal">Percent of metal cost</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="setting-making-charge-value">Making Charge Value</label>
                        <input class="field-input" id="setting-making-charge-value" type="number" step="0.01">
                        <span class="field-hint">₹/gram if flat, % if percent</span>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="setting-profit-multiplier">Profit Multiplier</label>
                        <input class="field-input" id="setting-profit-multiplier" type="number" step="0.01">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="setting-usd-rate">USD Conversion Rate (₹ per $1)</label>
                        <input class="field-input" id="setting-usd-rate" type="number" step="0.01">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="setting-final-adjustment">Final Adjustment (%)</label>
                        <input class="field-input" id="setting-final-adjustment" type="number" step="0.01">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="setting-max-decrease">Max Allowed Price Decrease (%)</label>
                        <input class="field-input" id="setting-max-decrease" type="number" step="0.01">
                    </div>
                </div>
                <s-stack direction="inline" gap="base">
                    <s-button id="settings-save-btn" variant="primary" onclick="saveSettings()">Save Settings</s-button>
                    <s-text id="settings-status"></s-text>
                </s-stack>
            </s-stack>
        </s-section>

        <s-section heading="Gold Rate">
            <s-stack gap="base">
                <s-stack direction="inline" gap="base">
                    <s-box>
                        <s-text>24K</s-text>
                        <s-heading id="gold-rate-24k">—</s-heading>
                    </s-box>
                    <s-box>
                        <s-text>18K</s-text>
                        <s-heading id="gold-rate-18k">—</s-heading>
                    </s-box>
                    <s-box>
                        <s-text>14K</s-text>
                        <s-heading id="gold-rate-14k">—</s-heading>
                    </s-box>
                    <s-box>
                        <s-text>10K</s-text>
                        <s-heading id="gold-rate-10k">—</s-heading>
                    </s-box>
                    <s-box>
                        <s-text>Last Fetched</s-text>
                        <s-text id="gold-rate-updated">Not fetched yet</s-text>
                    </s-box>
                </s-stack>
                <s-button id="fetch-gold-btn" onclick="fetchGoldRate()">Fetch Latest Gold Rate</s-button>
                <s-text id="gold-rate-error" tone="critical"></s-text>
            </s-stack>
        </s-section>

        <s-section heading="Select Products & Variants">
            <s-stack gap="base">
                <div class="form-grid">
                    <div class="field-group">
                        <label class="field-label" for="collection-select">Category</label>
                        <select class="field-input" id="collection-select" onchange="onCollectionChange()">
                            <option value="">Select a category...</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="product-search">Search Products</label>
                        <input class="field-input" id="product-search" type="text" placeholder="Type to search..." oninput="onSearchInput()">
                    </div>
                </div>

                <s-text id="products-error" tone="critical"></s-text>
                <div id="products-list"></div>
                <s-button id="load-more-btn" style="display:none;" onclick="loadMoreProducts()">Load More Products</s-button>

                <div>
                    <s-text>Selected Variants (<span id="selected-count">0</span>)</s-text>
                    <div class="chips-wrap" id="selected-chips"></div>
                </div>
            </s-stack>
        </s-section>

        <s-section heading="Update Prices">
            <s-stack gap="base">
                <s-stack direction="inline" gap="base">
                    <s-box>
                        <s-text>Total Variants Scanned</s-text>
                        <s-heading id="update-summary-total">—</s-heading>
                    </s-box>
                    <s-box>
                        <s-text>Updated</s-text>
                        <s-heading id="update-summary-updated">—</s-heading>
                    </s-box>
                    <s-box>
                        <s-text>Skipped</s-text>
                        <s-heading id="update-summary-skipped">—</s-heading>
                    </s-box>
                    <s-box>
                        <s-text>Blocked (unsafe)</s-text>
                        <s-heading id="update-summary-blocked">—</s-heading>
                    </s-box>
                </s-stack>

                <s-stack direction="inline" gap="base">
                    <s-button id="update-selected-btn" variant="primary" onclick="updateSelectedPrices()" disabled>Update Selected Variants</s-button>
                    <s-button id="update-full-btn" onclick="updateFullCatalogPrices()">Update Entire Catalog</s-button>
                </s-stack>
                <s-text id="update-error" tone="critical"></s-text>

                <div class="results-tabs">
                    <button type="button" class="results-tab-btn active" id="tab-updated-btn" onclick="switchResultsTab('updated')">Updated</button>
                    <button type="button" class="results-tab-btn" id="tab-skipped-btn" onclick="switchResultsTab('skipped')">Skipped</button>
                </div>

                <input class="field-input" id="results-search" type="text" placeholder="Search by product or SKU..." oninput="onResultsSearchInput()">

                <div id="results-updated-panel" class="results-panel"></div>
                <div id="results-skipped-panel" class="results-panel" style="display:none;"></div>
            </s-stack>
        </s-section>

        <s-section heading="Connection">
            <s-stack gap="base">
                <s-text id="connectionStatus">Not tested yet</s-text>
            </s-stack>
        </s-section>

    </s-page>
</body>

</html>
