name: Jewelry Price Automation

on:
  workflow_dispatch:

concurrency:
  group: jewelry-price-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  price-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Fetch and validate gold price
        run: node src/scraper.js

      - name: Verify validated gold prices
        run: |
          test -s gold-prices.json
          node -e "const p=require('./gold-prices.json'); for (const k of ['24K','18K','14K','10K','SILVER']) { if (!Number.isFinite(p[k]) || p[k] <= 0) process.exit(1); }"

      - name: Commit gold-prices.json
        run: |
          git config user.name "gold-price-bot"
          git config user.email "actions@github.com"
          git add gold-prices.json
          git diff --cached --quiet || git commit -m "Update gold prices [skip ci]"
          git push

      - name: Shopify DRY RUN
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
        run: node src/shopify-live.js
